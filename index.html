    function createGoogleMapLayers() {
      const googleHybrid = L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
        attribution: '&copy; Google Maps Satellite Imagery'
      });

      const googleSatellite = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
        attribution: '&copy; Google Maps Satellite'
      });

      const googleStreets = L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
        attribution: '&copy; Google Maps Streets'
      });

      const esriStreets = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19,
        attribution: '&copy; Esri World Street Map'
      });

      return {
        defaultLayer: googleHybrid,
        baseMaps: {
          "🛰️ Google Satellite (Hybrid + Roads)": googleHybrid,
          "📡 Google Satellite (Pure Imagery)": googleSatellite,
          "🗺️ Google Streets": googleStreets,

    const STORAGE_KEY_USER = "BGM_CURRENT_USER_V1";
    const STORAGE_KEY_OFFICERS = "BGM_OFFICERS_LIST_V1";

    function initDatabase() {
      try {
        const existing = localStorage.getItem(STORAGE_KEY_COMPLAINTS);
        if (!existing) {
          localStorage.setItem(STORAGE_KEY_COMPLAINTS, JSON.stringify(window.SEED_COMPLAINTS));
        }
        const existingOfficers = localStorage.getItem(STORAGE_KEY_OFFICERS);
        if (!existingOfficers) {
          localStorage.setItem(STORAGE_KEY_OFFICERS, JSON.stringify(window.OFFICERS_LIST));
        }
      } catch (e) {}
    }
    initDatabase();

    window.ApiService = {
      getComplaints: function () {
        initDatabase();
        try {
          const raw = localStorage.getItem(STORAGE_KEY_COMPLAINTS);
          return JSON.parse(raw) || window.SEED_COMPLAINTS;

      addOfficer: function (officerName) {
        const list = this.getOfficers();
        if (officerName && !list.includes(officerName)) {
          list.push(officerName);
          localStorage.setItem(STORAGE_KEY_OFFICERS, JSON.stringify(list));
        }
        return list;

      saveComplaints: function (list) {

          localStorage.setItem(STORAGE_KEY_COMPLAINTS, JSON.stringify(list));
        } catch (e) {}
      },

      getComplaintById: function (id) {
        if (!id) return null;
        const list = this.getComplaints();
        const cleanId = id.trim().toUpperCase();
        return list.find(c => c.complaint_id.toUpperCase() === cleanId) || null;
      },

      getComplaintsByUser: function (userContact) {
        const list = this.getComplaints();
        if (!userContact) return list;
        return list.filter(c => 
          (c.citizen_contact && c.citizen_contact.toLowerCase() === userContact.toLowerCase()) ||
          (c.citizen_mobile && c.citizen_mobile === userContact)
        );
      },

      createComplaint: function (data) {
        const list = this.getComplaints();
        const currentYear = new Date().getFullYear();
        const seqNumber = String(list.length + 1).padStart(4, "0");
        const newId = `SL-${currentYear}-${seqNumber}`;

        const now = new Date();
        const formattedDate = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")} ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;

        const newRecord = {
          complaint_id: newId,
          citizen_name: data.citizen_name || "Anonymous Citizen",
          citizen_contact: data.citizen_contact || "citizen@belagavi.gov.in",
          citizen_mobile: data.citizen_mobile || "9845123456",
          streetlight_id: data.streetlight_id || null,
          photo_url: data.photo_url || "assets/faulty_night.png",
          latitude: parseFloat(data.latitude) || 15.8497,
          longitude: parseFloat(data.longitude) || 74.4977,
          address: data.address || "Belagavi, Karnataka",
          problem_type: data.problem_type || "Streetlight not working",
          description: data.description || "Reported via civic fault app.",
          date_reported: formattedDate,
          status: "Submitted",
          assigned_officer: "Unassigned",
          admin_remarks: "Complaint logged successfully into Belagavi City Corporation database.",
          resolved_date: null,
          ward: data.ward || "Belagavi Municipal Area"
        };

        list.unshift(newRecord);
        this.saveComplaints(list);
        return newRecord;
      },

      updateComplaint: function (id, updateData) {
        const list = this.getComplaints();
        const index = list.findIndex(c => c.complaint_id.toUpperCase() === id.toUpperCase());
        if (index === -1) return null;

        const record = list[index];
        if (updateData.status) record.status = updateData.status;
        if (updateData.assigned_officer) record.assigned_officer = updateData.assigned_officer;
        if (updateData.admin_remarks !== undefined) record.admin_remarks = updateData.admin_remarks;

        if (updateData.status === "Resolved" && !record.resolved_date) {
          const now = new Date();
          record.resolved_date = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
        }

        list[index] = record;
        this.saveComplaints(list);
        return record;
      },

          if (raw) return JSON.parse(raw);

        return { name: "Rahul Sharma", email: "citizen@belagavi.gov.in", mobile: "9845123456", role: "citizen" };

      reverseGeocode: function (lat, lng, callback) {
        const fallbackAddress = () => {
          let area = "Belagavi Central";
          if (lat < 15.84) area = "Tilakwadi / Shahapur Area, Belagavi, Karnataka 590006";
          else if (lat > 15.86) area = "APMC / Auto Nagar Sector, Belagavi, Karnataka 590016";
          else if (lng > 74.51) area = "Khanapur Road, Camp Area, Belagavi, Karnataka 590001";
          else if (lng < 74.50) area = "Hindalga / Mandoli Bypass Road, Belagavi, Karnataka 590008";
          callback({ address: `${area} (${lat.toFixed(5)}°N, ${lng.toFixed(5)}°E)` });
        };

        try {
          fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`)
            .then(res => res.json())
            .then(data => {
              if (data && data.display_name) {
                const parts = data.display_name.split(',');
                const cleanAddress = parts.slice(0, 4).join(',').trim();
                callback({ address: `${cleanAddress} (${lat.toFixed(5)}°N, ${lng.toFixed(5)}°E)` });
              } else {
                fallbackAddress();
              }
            })
            .catch(() => fallbackAddress());
        } catch (err) {
          fallbackAddress();
        }
      },

      searchAddress: function (query, callback) {
        if (!query) return;
        const searchQuery = query.toLowerCase().includes("belagavi") || query.toLowerCase().includes("belgaum") 
          ? query 
          : `${query}, Belagavi, Karnataka`;

        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(searchQuery)}`)
          .then(res => res.json())
          .then(data => {
            if (data && data.length > 0) {
              const bestMatch = data[0];
              callback({
                lat: parseFloat(bestMatch.lat),
                lng: parseFloat(bestMatch.lon),
                displayName: bestMatch.display_name
              });
            } else {
              callback(null);
            }
          })
          .catch(err => callback(null));
      }
    };

    // ReportFaultPage Component
    const ReportFaultPage = ({ currentUser, onSubmissionSuccess }) => {
      const [formData, setFormData] = React.useState({
        citizen_name: currentUser ? currentUser.name : "Rahul Sharma",
        citizen_contact: currentUser ? currentUser.email : "citizen@belagavi.gov.in",
        citizen_mobile: currentUser ? currentUser.mobile : "9845123456",
        streetlight_id: "",
        photo_url: "assets/faulty_night.png",
        latitude: 15.8497,
        longitude: 74.4977,
        address: "RP Road, Tilakwadi, Belagavi, Karnataka 590006",
        problem_type: "Streetlight not working",
        description: "",
        ward: "Ward 14 - Tilakwadi"
      });

      const [searchQuery, setSearchQuery] = React.useState("");
      const [searchLoading, setSearchLoading] = React.useState(false);
      const [gpsLoading, setGpsLoading] = React.useState(false);
      const [gpsCaptured, setGpsCaptured] = React.useState(false);
      const [showCameraModal, setShowCameraModal] = React.useState(false);
      const [photoPreview, setPhotoPreview] = React.useState("assets/faulty_night.png");

      const videoRef = React.useRef(null);
      const canvasRef = React.useRef(null);
      const mapRef = React.useRef(null);
      const markerRef = React.useRef(null);

      React.useEffect(() => {
        if (!window.L) return;
        const mapElement = document.getElementById("report-mini-map");
        if (!mapElement) return;

        if (!mapRef.current) {
          const initialLat = formData.latitude;
          const initialLng = formData.longitude;
          const map = L.map("report-mini-map").setView([initialLat, initialLng], 15);

          const layersObj = createGoogleMapLayers();
          layersObj.defaultLayer.addTo(map);
          L.control.layers(layersObj.baseMaps).addTo(map);

          const customMarkerIcon = L.divIcon({
            className: 'custom-map-pin',
            html: `<div style="background:#EF4444; width:28px; height:28px; border-radius:50%; border:3px solid white; box-shadow:0 0 12px rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; color:white; font-size:14px; font-weight:bold;">📍</div>`,
            iconSize: [28, 28],
            iconAnchor: [14, 14]
          });

          const marker = L.marker([initialLat, initialLng], { icon: customMarkerIcon, draggable: true }).addTo(map);

          marker.on('dragend', function (e) {
            const latlng = e.target.getLatLng();
            updateLocationFromCoords(latlng.lat, latlng.lng);
          });

          map.on('click', function (e) {
            marker.setLatLng(e.latlng);
            updateLocationFromCoords(e.latlng.lat, e.latlng.lng);
          });

          mapRef.current = map;
          markerRef.current = marker;
        }
      }, []);

      const updateLocationFromCoords = (lat, lng) => {
        setFormData(prev => ({ ...prev, latitude: lat, longitude: lng }));
        window.ApiService.reverseGeocode(lat, lng, (result) => {
          setFormData(prev => ({ ...prev, address: result.address }));
        });
      };

      const handleGetLocation = () => {
        setGpsLoading(true);
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              const lat = position.coords.latitude;
              const lng = position.coords.longitude;
              setGpsLoading(false);
              setGpsCaptured(true);
              updateLocationFromCoords(lat, lng);

              if (mapRef.current && markerRef.current) {
                mapRef.current.setView([lat, lng], 18);
                markerRef.current.setLatLng([lat, lng]);
              }
            },
            (error) => {
              setGpsLoading(false);
              alert("Browser Geolocation access was declined or unavailable. You can click anywhere on the Google Satellite map or type any place in the search bar below to pinpoint location.");
              updateLocationFromCoords(15.8497, 74.4977);
            },
            { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
          );
        } else {
          setGpsLoading(false);
          alert("Geolocation is not supported by your browser.");
        }
      };

      const handleSearchPlace = (e) => {
        e.preventDefault();
        if (!searchQuery) return;
        setSearchLoading(true);

        window.ApiService.searchAddress(searchQuery, (result) => {
          setSearchLoading(false);
          if (result) {
            setFormData(prev => ({
              ...prev,
              latitude: result.lat,
              longitude: result.lng,
              address: `${result.displayName} (${result.lat.toFixed(5)}°N, ${result.lng.toFixed(5)}°E)`
            }));

            if (mapRef.current && markerRef.current) {
              mapRef.current.setView([result.lat, result.lng], 17);
              markerRef.current.setLatLng([result.lat, result.lng]);
            }
          } else {
            alert(`Could not find coordinates for "${searchQuery}". Please click directly on the Google Satellite map to pinpoint location.`);
          }
        });
      };

      const handleFileChange = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setPhotoPreview(reader.result);
            setFormData(prev => ({ ...prev, photo_url: reader.result }));
          };
          reader.readAsDataURL(file);
        }
      };

      const startCamera = async () => {
        setShowCameraModal(true);
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
          }
        } catch (err) {}
      };

      const captureCameraPhoto = () => {
        if (videoRef.current && canvasRef.current) {
          const context = canvasRef.current.getContext('2d');
          canvasRef.current.width = videoRef.current.videoWidth || 640;
          canvasRef.current.height = videoRef.current.videoHeight || 480;
          context.drawImage(videoRef.current, 0, 0);
          const dataUrl = canvasRef.current.toDataURL('image/jpeg');
          setPhotoPreview(dataUrl);
          setFormData(prev => ({ ...prev, photo_url: dataUrl }));
          stopCamera();
        } else {
          setPhotoPreview("assets/faulty_night.png");
          setFormData(prev => ({ ...prev, photo_url: "assets/faulty_night.png" }));
          setShowCameraModal(false);
        }
      };

      const stopCamera = () => {
        if (videoRef.current && videoRef.current.srcObject) {
          const stream = videoRef.current.srcObject;
          stream.getTracks().forEach(track => track.stop());
        }
        setShowCameraModal(false);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.citizen_name || !formData.citizen_contact) {
          alert("Please fill in your name and contact email/mobile.");
          return;
        }
        if (!formData.description) {
          alert("Please provide a short description of the fault.");
          return;
        }

        const newRecord = window.ApiService.createComplaint(formData);
        onSubmissionSuccess(newRecord);
      };

      return (
        <div style={{ maxWidth: '900px', margin: '0 auto' }}>
          <div className="card">
            <div className="card-header">
              <div className="card-title"><span>📷</span> Report a Streetlight Fault</div>
              <span style={{ fontSize: '0.8rem', background: '#FEF3C7', color: '#B45309', padding: '4px 10px', borderRadius: '12px', fontWeight: 600 }}>
                Belagavi City Corporation Area
              </span>
            </div>

            <form onSubmit={handleSubmit}>
              <div style={{ marginBottom: '24px' }}>
                <h4 style={{ fontSize: '1rem', color: 'var(--color-civic-dark)', marginBottom: '14px', borderBottom: '1px solid var(--border-light)', paddingBottom: '6px' }}>
                  1. Reporter Details
                </h4>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}>
                  <div className="form-group">
                    <label className="form-label">Citizen Name *</label>
                    <input type="text" className="form-control" required value={formData.citizen_name} onChange={e => setFormData({ ...formData, citizen_name: e.target.value })} />
                  </div>
                  <div className="form-group">
                    <label className="form-label">Mobile / Email *</label>
                    <input type="text" className="form-control" required value={formData.citizen_contact} onChange={e => setFormData({ ...formData, citizen_contact: e.target.value, citizen_mobile: e.target.value })} />
                  </div>
                </div>
              </div>

              <div style={{ marginBottom: '24px' }}>
                <h4 style={{ fontSize: '1rem', color: 'var(--color-civic-dark)', marginBottom: '14px', borderBottom: '1px solid var(--border-light)', paddingBottom: '6px' }}>
                  2. Streetlight Fault Information
                </h4>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}>
                  <div className="form-group">
                    <label className="form-label">Problem Type *</label>
                    <select className="form-control" value={formData.problem_type} onChange={e => setFormData({ ...formData, problem_type: e.target.value })}>
                      <option value="Streetlight not working">Streetlight not working (Dark)</option>
                      <option value="Light flickering">Light flickering continuously</option>
                      <option value="Damaged streetlight">Damaged streetlight fixture/glass</option>
                      <option value="Pole damaged">Pole damaged / bent / dangerous</option>
                      <option value="Other">Other electrical issue</option>
                    </select>
                  </div>
                  <div className="form-group">
                    <label className="form-label">Streetlight Pole ID (Optional)</label>
                    <input type="text" className="form-control" placeholder="e.g. BGM-SL-8042" value={formData.streetlight_id} onChange={e => setFormData({ ...formData, streetlight_id: e.target.value })} />
                  </div>
                </div>

                <div className="form-group">
                  <label className="form-label">Description of Problem *</label>
                  <textarea className="form-control" rows="3" required placeholder="Describe the issue..." value={formData.description} onChange={e => setFormData({ ...formData, description: e.target.value })}></textarea>
                </div>
              </div>

              <div style={{ marginBottom: '24px' }}>
                <h4 style={{ fontSize: '1rem', color: 'var(--color-civic-dark)', marginBottom: '14px', borderBottom: '1px solid var(--border-light)', paddingBottom: '6px' }}>
                  3. Upload Photograph Evidence *
                </h4>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px', alignItems: 'center' }}>
                  <div>
                    <div className="upload-box" onClick={() => document.getElementById('photo-input').click()}>
                      <div style={{ fontSize: '2rem', marginBottom: '8px' }}>📸</div>
                      <div style={{ fontWeight: 700, fontSize: '0.95rem' }}>Click to Upload Photograph</div>
                      <input type="file" id="photo-input" accept="image/*" style={{ display: 'none' }} onChange={handleFileChange} />
                    </div>
                    <div style={{ textAlign: 'center', margin: '10px 0' }}>OR</div>
                    <button type="button" className="btn-outline-dark" style={{ width: '100%', justifyContent: 'center' }} onClick={startCamera}>🎥 Use Mobile Camera</button>
                  </div>
                  <div style={{ textAlign: 'center' }}>
                    <img src={photoPreview} alt="Preview" className="preview-image" />
                  </div>
                </div>
              </div>

              <div style={{ marginBottom: '24px' }}>
                <h4 style={{ fontSize: '1rem', color: 'var(--color-civic-dark)', marginBottom: '14px', borderBottom: '1px solid var(--border-light)', paddingBottom: '6px' }}>
                  4. Google Satellite Map GPS & Geocoding *
                </h4>
                
                <div style={{ display: 'flex', gap: '12px', alignItems: 'center', marginBottom: '12px' }}>
                  <button type="button" className="btn-primary" onClick={handleGetLocation} disabled={gpsLoading}>
                    {gpsLoading ? '📡 Capturing Device GPS...' : '📍 Capture My Current GPS Location'}
                  </button>
                  {gpsCaptured && <span style={{ color: '#10B981', fontWeight: 700, fontSize: '0.85rem' }}>✓ Live GPS Verified</span>}
                </div>

                <div style={{ background: 'var(--bg-card-alt)', padding: '12px', borderRadius: '8px', marginBottom: '12px', border: '1px solid var(--border-medium)' }}>
                  <div style={{ fontSize: '0.82rem', fontWeight: 700, marginBottom: '6px' }}>🔍 Search Any Real Place or Landmark:</div>
                  <div style={{ display: 'flex', gap: '8px' }}>
                    <input 
                      type="text" 
                      className="form-control" 
                      placeholder="e.g. Tilakwadi Belagavi, KLE Hospital, VTU Machhe..." 
                      value={searchQuery}
                      onChange={e => setSearchQuery(e.target.value)}
                      onKeyDown={e => e.key === 'Enter' && handleSearchPlace(e)}
                    />
                    <button type="button" className="btn-secondary" onClick={handleSearchPlace} disabled={searchLoading}>
                      {searchLoading ? 'Searching...' : 'Find Place'}
                    </button>
                  </div>
                </div>

                <div className="gps-info-box">
                  <div style={{ width: '100%' }}>
                    <div style={{ display: 'flex', gap: '12px', alignItems: 'center', marginBottom: '6px' }}>
                      <span className="gps-coords-badge">LAT: {formData.latitude.toFixed(5)}° N</span>
                      <span className="gps-coords-badge">LONG: {formData.longitude.toFixed(5)}° E</span>
                    </div>
                    <label className="form-label" style={{ fontSize: '0.8rem', marginTop: '6px' }}>Resolved Real Street Address</label>
                    <input type="text" className="form-control" value={formData.address} onChange={e => setFormData({ ...formData, address: e.target.value })} />
                  </div>
                </div>

                <div style={{ marginTop: '14px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '6px' }}>
                    <span style={{ fontSize: '0.82rem', fontWeight: 700 }}>
                      🛰️ Google Maps Satellite View (Use layer icon top-right to switch Satellite / Hybrid / Streets):
                    </span>
                  </div>
                  <div id="report-mini-map" style={{ height: '320px', borderRadius: '8px', border: '2px solid var(--color-civic-dark)' }}></div>
                </div>
              </div>

              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', paddingTop: '16px', borderTop: '2px solid var(--border-light)' }}>
                <button type="submit" className="btn-primary" style={{ padding: '14px 32px', fontSize: '1.05rem' }}>🚀 Submit Fault Complaint</button>
              </div>
            </form>
          </div>

          {showCameraModal && (
            <div className="modal-overlay">
              <div className="modal-card" style={{ maxWidth: '500px' }}>
                <div className="modal-header">
                  <h3>📷 Mobile Camera Capture</h3>
                  <button onClick={stopCamera} style={{ border: 'none', background: 'none', fontSize: '1.4rem', cursor: 'pointer' }}>×</button>
                </div>
                <div className="modal-body" style={{ textAlign: 'center' }}>
                  <video ref={videoRef} autoPlay playsInline style={{ width: '100%', borderRadius: '8px', background: '#000' }}></video>
                  <canvas ref={canvasRef} style={{ display: 'none' }}></canvas>
                </div>
                <div className="modal-footer">
                  <button className="btn-secondary" onClick={stopCamera}>Cancel</button>
                  <button className="btn-primary" onClick={captureCameraPhoto}>Snap Photo</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // SuccessPage Component
    const SuccessPage = ({ complaint, setActiveTab, setSelectedComplaintId }) => {
      if (!complaint) return null;
      return (
        <div style={{ maxWidth: '750px', margin: '20px auto' }}>
          <div className="card" style={{ textAlign: 'center', borderTop: '6px solid #10B981' }}>
            <div style={{ width: '70px', height: '70px', borderRadius: '50%', background: '#ECFDF5', color: '#10B981', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '2.5rem', margin: '0 auto 16px auto' }}>✓</div>
            <h2 style={{ fontSize: '1.8rem', fontWeight: 800, color: 'var(--color-civic-dark)' }}>Complaint Submitted Successfully!</h2>
            <div style={{ background: 'linear-gradient(135deg, var(--color-civic-dark), var(--color-civic-navy))', color: 'white', padding: '20px', borderRadius: '12px', margin: '20px 0' }}>

      const [searched, setSearched] = React.useState(false);

      const STAGES = [

        { key: "Under Review", label: "Under Review", icon: "🧐" },
        { key: "Assigned", label: "Assigned", icon: "👷" },

        const record = window.ApiService.getComplaintById(query);
        setComplaint(record);
        setSearched(true);

      const getStageIndex = (status) => {
        if (!status) return 0;
        const index = STAGES.findIndex(s => s.key.toLowerCase() === status.toLowerCase());
        return index !== -1 ? index : 0;

      const currentStageIndex = complaint ? getStageIndex(complaint.status) : 0;

                  <div key={stage.key} className={`timeline-step ${idx < currentStageIndex ? 'completed' : ''} ${idx === currentStageIndex ? 'active' : ''}`}>
                    <div className="timeline-node">{idx < currentStageIndex ? "✓" : stage.icon}</div>

      const markersLayerRef = React.useRef(null);

      React.useEffect(() => {
        setComplaints(window.ApiService.getComplaints());
      }, []);

      React.useEffect(() => {
        if (!window.L) return;
        const container = document.getElementById("public-main-map");
        if (!container) return;

        if (!mapRef.current) {
          const map = L.map("public-main-map").setView([15.8497, 74.4977], 13);
          
          const layersObj = createGoogleMapLayers();
          layersObj.defaultLayer.addTo(map);

          L.control.layers(layersObj.baseMaps).addTo(map);

          mapRef.current = map;
          markersLayerRef.current = L.layerGroup().addTo(map);
        }

        renderMarkers();
      }, [complaints]);

      const renderMarkers = () => {
        if (!markersLayerRef.current) return;
        markersLayerRef.current.clearLayers();

        complaints.forEach(c => {
          let pinColor = "#EF4444";
          if (c.status === "In Progress" || c.status === "Under Review" || c.status === "Assigned") pinColor = "#F59E0B";
          if (c.status === "Resolved") pinColor = "#10B981";

          const customIcon = L.divIcon({
            className: 'custom-leaflet-marker',
            html: `<div style="background:${pinColor}; width:28px; height:28px; border-radius:50%; border:3px solid white; box-shadow:0 0 12px rgba(0,0,0,0.8); display:flex; align-items:center; justify-content:center; color:white; font-weight:bold; font-size:12px;">💡</div>`,
            iconSize: [28, 28],
            iconAnchor: [14, 14]
          });

          const marker = L.marker([c.latitude, c.longitude], { icon: customIcon });
          marker.bindPopup(`
            <div style="font-family:sans-serif; width:210px;">
              <div style="font-weight:800; color:#0B192C;">${c.complaint_id}</div>
              <div style="font-size:12px; color:#475569; font-weight:600;">${c.problem_type}</div>
              <img src="${c.photo_url}" style="width:100%; height:100px; object-fit:cover; border-radius:4px; margin:4px 0;" />

              <div><span style="font-size:10px; padding:2px 6px; border-radius:10px; background:${pinColor}; color:white; font-weight:bold;">${c.status}</span></div>
            </div>
          `);
          markersLayerRef.current.addLayer(marker);
        });
      };

    // 4. MAIN APP CONTAINER
    // ==========================================
    const App = () => {
      const [activeTab, setActiveTab] = React.useState("home");
      const [currentUser, setCurrentUser] = React.useState(null);
      const [lastSubmittedComplaint, setLastSubmittedComplaint] = React.useState(null);
      const [selectedComplaintId, setSelectedComplaintId] = React.useState("SL-2026-0001");
      const [showAcademicDoc, setShowAcademicDoc] = React.useState(false);

      React.useEffect(() => {
        const user = window.ApiService.getCurrentUser();
        if (user) setCurrentUser(user);
      }, []);

      const handleSubmissionSuccess = (newComplaint) => {
        setLastSubmittedComplaint(newComplaint);
        setSelectedComplaintId(newComplaint.complaint_id);
        setActiveTab("success");
      };

      return (
        <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100vh' }}>
          <Navbar activeTab={activeTab} setActiveTab={setActiveTab} currentUser={currentUser} setCurrentUser={setCurrentUser} openAcademicDoc={() => setShowAcademicDoc(true)} />
          <main className="main-wrapper">
            {activeTab === "home" && <HomePage setActiveTab={setActiveTab} openAcademicDoc={() => setShowAcademicDoc(true)} />}
            {activeTab === "report" && <ReportFaultPage currentUser={currentUser} onSubmissionSuccess={handleSubmissionSuccess} />}
            {activeTab === "success" && <SuccessPage complaint={lastSubmittedComplaint} setActiveTab={setActiveTab} setSelectedComplaintId={setSelectedComplaintId} />}
            {activeTab === "track" && <TrackComplaintPage initialId={selectedComplaintId} />}
            {activeTab === "dashboard" && <CitizenDashboard currentUser={currentUser} setActiveTab={setActiveTab} setSelectedComplaintId={setSelectedComplaintId} />}
            {activeTab === "admin" && <AdminDashboard setActiveTab={setActiveTab} setSelectedComplaintId={setSelectedComplaintId} />}
            {activeTab === "map" && <MapViewPage setSelectedComplaintId={setSelectedComplaintId} setActiveTab={setActiveTab} />}
            {activeTab === "analytics" && <AnalyticsPage />}
            {activeTab === "auth" && <AuthPage setCurrentUser={setCurrentUser} setActiveTab={setActiveTab} />}
          </main>
          <Footer setActiveTab={setActiveTab} openAcademicDoc={() => setShowAcademicDoc(true)} />
          {showAcademicDoc && <AcademicDocModal onClose={() => setShowAcademicDoc(false)} />}
        </div>
      );
    };

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
